<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>OneTap Orders</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
        --bg: #000;
        --card: #0c0c0c;
        --tx: #fff;
        --mu: #9a9a9a;
        --bd: #2c2c2c;
        --pr: #fff;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--card);
        border-bottom: 1px solid var(--bd);
        padding: 10px 14px;
      }
      .hd {
        max-width: 1100px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h1 span {
        color: #9a9a9a;
      }
      nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      nav button {
        background: none;
        border: 1px solid var(--bd);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 99px;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }
      nav button.on {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 14px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .two {
        grid-template-columns: 1fr;
      }
      @media (min-width: 700px) {
        .stats {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (min-width: 900px) {
        .two {
          grid-template-columns: 380px 1fr;
          align-items: start;
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
      }
      .stat small {
        color: var(--mu);
        display: block;
      }
      .stat b {
        font-size: 20px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--mu);
        margin: 8px 0 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        color-scheme: dark;
        padding: 10px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .btn {
        background: #fff;
        color: #000;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 12px;
      }
      .btn.g {
        background: none;
        color: #fff;
        border: 1px solid #555;
      }
      .sum {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
      }
      .sum div {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      .sum .t {
        font-weight: 700;
        font-size: 17px;
        border-top: 1px dashed var(--bd);
        margin-top: 4px;
        padding-top: 6px;
      }
      .tag {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 0;
      }
      .pending {
        background: transparent;
        color: #fff;
        border: 1px solid #777;
      }
      .done {
        background: #fff;
        color: #000;
      }
      .error {
        background: #333;
        color: #aaa;
        text-decoration: line-through;
      }
      .o {
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .o .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: start;
      }
      .o p {
        margin: 2px 0;
        color: var(--mu);
        font-size: 13px;
      }
      .o .acts {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .o .acts button {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--bd);
        background: none;
        color: var(--tx);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .bal {
        color: #fff;
        font-weight: 700;
        text-decoration: underline;
      }
      .flt {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .flt select {
        width: auto;
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      th {
        color: var(--mu);
        font-weight: 600;
        font-size: 12px;
      }
      .x {
        background: none;
        border: 0;
        color: #aaa;
        cursor: pointer;
        font-size: 16px;
      }
      .empty {
        color: var(--mu);
        text-align: center;
        padding: 20px;
      }
      .hide {
        display: none;
      }
      .note {
        font-size: 12px;
        color: var(--mu);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hd">
        <h1>OneTap <span>Orders</span></h1>
        <nav id="nav">
          <button data-t="orders" class="on">Orders</button
          ><button data-t="inv">Inventory</button
          ><button data-t="cost">Unit Costs</button>
        </nav>
      </div>
    </header>
    <main>
      <section id="orders">
        <div class="grid stats" id="stats"></div>
        <div class="grid two" style="margin-top: 14px">
          <div class="card">
            <h2 id="ft">New order</h2>
            <label>Name</label><input id="nm" placeholder="Customer name" />
            <label>Contact number</label
            ><input
              id="ph"
              type="tel"
              inputmode="tel"
              placeholder="09xx xxx xxxx"
            />
            <label>Address</label
            ><textarea
              id="ad"
              rows="2"
              placeholder="Delivery address"
            ></textarea>
            <div class="row">
              <div>
                <label>Item</label
                ><select id="it"></select>
              </div>
              <div>
                <label>Quantity</label
                ><input id="qt" type="number" min="1" value="1" />
              </div>
            </div>
            <div class="row">
              <div>
                <label>Delivery fee (₱)</label
                ><input id="df" type="number" min="0" value="0" />
              </div>
              <div>
                <label>Amount paid (₱)</label
                ><input id="pd" type="number" min="0" value="0" />
              </div>
            </div>
            <label>Status</label
            ><select id="st">
              <option value="pending">Pending</option>
              <option value="done">Done</option>
            </select>
            <div class="sum" id="sum"></div>
            <button class="btn" id="save">Save order</button
            ><button class="btn g hide" id="cancel">Cancel edit</button>
          </div>
          <div class="card">
            <h2>Order tracking</h2>
            <div class="flt">
              <input
                id="q"
                placeholder="Search name / contact / address"
              /><select id="f">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div id="list"></div>
          </div>
        </div>
      </section>

      <section id="inv" class="hide">
        <div class="grid stats" id="istats"></div>
        <div class="grid two" style="margin-top: 14px">
          <div class="card">
            <h2>Add inventory cost</h2>
            <div class="row">
              <div>
                <label>Cost (₱)</label><input id="ic" type="number" min="0" />
              </div>
              <div>
                <label>Item</label
                ><input id="ii" list="il" placeholder="sticker, card…" />
              </div>
            </div>
            <datalist id="il">
              <option>sticker</option>
              <option>card</option>
              <option>chips</option>
              <option>keychain</option>
              <option>print</option>
              <option>zipbag</option>
            </datalist>
            <label>Status</label
            ><select id="is">
              <option value="done">Done</option>
              <option value="error">Error</option>
            </select>
            <div class="row">
              <div>
                <label>Matthew paid</label
                ><input id="im" type="number" min="0" />
              </div>
              <div>
                <label>Earl paid</label><input id="ie" type="number" min="0" />
              </div>
            </div>
            <p class="note">
              Leave both payer boxes blank and Earl is filled with the full
              cost.
            </p>
            <button class="btn" id="iadd">Add</button>
          </div>
          <div class="card">
            <h2>Inventory log</h2>
            <div class="scroll" id="itab"></div>
          </div>
        </div>
      </section>

      <section id="cost" class="hide">
        <div class="card">
          <h2>Cost per piece</h2>
          <div class="scroll"><table id="ctab"></table></div>
          <p class="note">
            Edit the numbers below to update the card/keychain totals. Used for
            the profit estimate on the Inventory tab.
          </p>
          <div class="row" id="cedit"></div>
        </div>
      </section>
    </main>
    <script>
      const ITEMS = [
        ["Keychain", 199],
        ["Stand Starter Pack", 499],
        ["Stand VIP Pack", 699],
        ["Card", 299],
        ["Card VIP", 599],
      ];
      const $ = (id) => document.getElementById(id);
      const peso = (n) =>
        "₱" + (Math.round(n * 100) / 100).toLocaleString("en-PH");
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const SEED = [
        [70, "sticker", "done", 70, 0],
        [210, "sticker", "done", 100, 110],
        [125, "card", "done", 0, 125],
        [60, "sticker", "done", 0, 60],
        [110, "sticker", "done", 0, 110],
        [114, "chips", "done", 0, 114],
        [156, "keychain", "done", 0, 156],
        [50, "print", "done", 0, 50],
        [65, "print", "done", 0, 65],
        [386, "card", "error", 0, 386],
        [220, "chips", "done", 0, 220],
        [128, "keychain", "done", 0, 128],
        [149, "zipbag", "done", 0, 149],
      ].map((r, i) => ({
        id: "s" + i,
        cost: r[0],
        item: r[1],
        status: r[2],
        m: r[3],
        e: r[4],
      }));
      let S = { orders: [], inv: SEED, costs: { card: 25.62, kc: 14.33 } },
        editId = null;
      try {
        const r = localStorage.getItem("onetap_v1");
        if (r) S = Object.assign(S, JSON.parse(r));
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("onetap_v1", JSON.stringify(S));
        } catch (e) {}
      };
      $("it").innerHTML = ITEMS.map(
        (x, i) => `<option value="${i}">${x[0]} — ₱${x[1]}</option>`,
      ).join("");

      document.querySelectorAll("#nav button").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll("#nav button")
              .forEach((x) => x.classList.toggle("on", x === b));
            ["orders", "inv", "cost"].forEach((t) =>
              $(t).classList.toggle("hide", t !== b.dataset.t),
            );
          }),
      );

      const num = (id) => Math.max(0, parseFloat($(id).value) || 0);
      function calc() {
        const price = ITEMS[$("it").value][1],
          q = Math.max(1, num("qt") || 1),
          sub = price * q,
          df = num("df"),
          tot = sub + df,
          pd = num("pd");
        $("sum").innerHTML =
          `<div><span>Item price</span><span>${peso(price)}</span></div><div><span>Subtotal (×${q})</span><span>${peso(sub)}</span></div><div><span>Delivery fee</span><span>${peso(df)}</span></div><div class="t"><span>Total</span><span>${peso(tot)}</span></div><div><span>Paid</span><span>${peso(pd)}</span></div><div><span>${pd > tot ? "Change/Over" : "Balance"}</span><b class="${tot > pd ? "bal" : ""}">${peso(Math.abs(tot - pd))}</b></div>`;
        return { price, q, sub, df, tot, pd };
      }
      ["it", "qt", "df", "pd"].forEach((i) =>
        $(i).addEventListener("input", calc),
      );

      $("save").onclick = () => {
        const nm = $("nm").value.trim();
        if (!nm) {
          $("nm").focus();
          return;
        }
        const c = calc(),
          o = {
            id: editId || "o" + Date.now(),
            name: nm,
            phone: $("ph").value.trim(),
            addr: $("ad").value.trim(),
            item: +$("it").value,
            qty: c.q,
            df: c.df,
            paid: c.pd,
            status: $("st").value,
            date: new Date().toISOString(),
          };
        if (editId) {
          const i = S.orders.findIndex((x) => x.id === editId);
          o.date = S.orders[i].date;
          S.orders[i] = o;
        } else S.orders.unshift(o);
        save();
        reset();
        render();
      };
      function reset() {
        editId = null;
        ["nm", "ph", "ad"].forEach((i) => ($(i).value = ""));
        $("qt").value = 1;
        $("df").value = 0;
        $("pd").value = 0;
        $("st").value = "pending";
        $("it").value = 0;
        $("ft").textContent = "New order";
        $("save").textContent = "Save order";
        $("cancel").classList.add("hide");
        calc();
      }
      $("cancel").onclick = reset;
      $("q").oninput = $("f").onchange = render;

      function tot(o) {
        return ITEMS[o.item][1] * o.qty + o.df;
      }
      function render() {
        const O = S.orders,
          sales = O.reduce((a, o) => a + tot(o), 0),
          paid = O.reduce((a, o) => a + o.paid, 0);
        $("stats").innerHTML = [
          ["Orders", O.length],
          ["Pending", O.filter((o) => o.status === "pending").length],
          ["Total sales", peso(sales)],
          ["Unpaid balance", peso(Math.max(0, sales - paid))],
        ]
          .map(
            (s) =>
              `<div class="card stat"><small>${s[0]}</small><b>${s[1]}</b></div>`,
          )
          .join("");
        const q = $("q").value.toLowerCase(),
          f = $("f").value;
        const L = O.filter(
          (o) =>
            (f === "all" || o.status === f) &&
            (o.name + o.phone + o.addr).toLowerCase().includes(q),
        );
        $("list").innerHTML = L.length
          ? L.map((o) => {
              const t = tot(o),
                b = t - o.paid;
              return `<div class="o"><div class="top"><div><b>${esc(o.name)}</b><p>📞 ${esc(o.phone || "—")}</p><p>📍 ${esc(o.addr || "—")}</p></div><button class="tag ${o.status}" data-tg="${o.id}">${o.status}</button></div>
 <p>${esc(ITEMS[o.item][0])} ×${o.qty} (${peso(ITEMS[o.item][1])}) + delivery ${peso(o.df)}</p>
 <p><b style="color:var(--tx)">Total ${peso(t)}</b> · Paid ${peso(o.paid)} · ${b > 0 ? `<span class="bal">Balance ${peso(b)}</span>` : "Fully paid"}</p>
 <p>${new Date(o.date).toLocaleDateString()}</p><div class="acts"><button data-ed="${o.id}">Edit</button><button data-dl="${o.id}">Delete</button></div></div>`;
            }).join("")
          : `<div class="empty">No orders yet</div>`;
        const C = S.costs;
        const sd = S.inv.filter((x) => x.status === "done"),
          ok = sd.reduce((a, x) => a + x.cost, 0),
          er = S.inv
            .filter((x) => x.status === "error")
            .reduce((a, x) => a + x.cost, 0);
        const m = S.inv.reduce((a, x) => a + x.m, 0),
          e = S.inv.reduce((a, x) => a + x.e, 0),
          done = O.filter((o) => o.status === "done").reduce(
            (a, o) => a + tot(o),
            0,
          );
        $("istats").innerHTML = [
          ["Total spent", peso(ok + er)],
          ["Error loss", peso(er)],
          ["Matthew / Earl", peso(m) + " / " + peso(e)],
          ["Est. profit (done sales − spent)", peso(done - ok - er)],
        ]
          .map(
            (s) =>
              `<div class="card stat"><small>${s[0]}</small><b>${s[1]}</b></div>`,
          )
          .join("");
        $("itab").innerHTML =
          `<table><tr><th>Cost</th><th>Item</th><th>Status</th><th>Matthew</th><th>Earl</th><th></th></tr>${S.inv.map((x) => `<tr><td>${peso(x.cost)}</td><td>${esc(x.item)}</td><td><button class="tag ${x.status}" data-it="${x.id}">${x.status}</button></td><td>${x.m ? peso(x.m) : ""}</td><td>${x.e ? peso(x.e) : ""}</td><td><button class="x" data-di="${x.id}">✕</button></td></tr>`).join("")}<tr><th>${peso(ok + er)}</th><th></th><th></th><th>${peso(m)}</th><th>${peso(e)}</th><th></th></tr></table>`;
        const rows = [
          ["Card (each)", C.card],
          ["Keychain (each)", C.kc],
          ["Sold: Card ₱299 profit", 299 - C.card],
          ["Sold: Keychain ₱199 profit", 199 - C.kc],
        ];
        $("ctab").innerHTML =
          `<tr><th>Item</th><th>Cost</th></tr>` +
          rows
            .map((r) => `<tr><td>${r[0]}</td><td>${peso(r[1])}</td></tr>`)
            .join("");
        $("cedit").innerHTML =
          `<div><label>Card cost</label><input id="cc" type="number" step="0.01" value="${C.card}"></div><div><label>Keychain cost</label><input id="ck" type="number" step="0.01" value="${C.kc}"></div>`;
        $("cc").onchange = () => {
          S.costs.card = parseFloat($("cc").value) || 0;
          save();
          render();
        };
        $("ck").onchange = () => {
          S.costs.kc = parseFloat($("ck").value) || 0;
          save();
          render();
        };
      }
      document.addEventListener("click", (ev) => {
        const d = ev.target.dataset;
        if (!d) return;
        if (d.tg) {
          const o = S.orders.find((x) => x.id === d.tg);
          o.status = o.status === "done" ? "pending" : "done";
          save();
          render();
        }
        if (d.dl && confirm("Delete this order?")) {
          S.orders = S.orders.filter((x) => x.id !== d.dl);
          save();
          render();
        }
        if (d.ed) {
          const o = S.orders.find((x) => x.id === d.ed);
          editId = o.id;
          $("nm").value = o.name;
          $("ph").value = o.phone;
          $("ad").value = o.addr;
          $("it").value = o.item;
          $("qt").value = o.qty;
          $("df").value = o.df;
          $("pd").value = o.paid;
          $("st").value = o.status;
          $("ft").textContent = "Edit order";
          $("save").textContent = "Update order";
          $("cancel").classList.remove("hide");
          calc();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        if (d.it) {
          const x = S.inv.find((i) => i.id === d.it);
          x.status = x.status === "done" ? "error" : "done";
          save();
          render();
        }
        if (d.di && confirm("Delete this entry?")) {
          S.inv = S.inv.filter((x) => x.id !== d.di);
          save();
          render();
        }
      });
      $("iadd").onclick = () => {
        const c = num("ic"),
          it = $("ii").value.trim();
        if (!c || !it) {
          return;
        }
        let m = num("im"),
          e = num("ie");
        if (!m && !e) e = c;
        S.inv.push({
          id: "i" + Date.now(),
          cost: c,
          item: it,
          status: $("is").value,
          m,
          e,
        });
        ["ic", "ii", "im", "ie"].forEach((i) => ($(i).value = ""));
        save();
        render();
      };
      calc();
      render();
    </script>
  </body>
</html>
